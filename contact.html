<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Brand Haine Termice Moto</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="haine-termice.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">S</div>
        <nav>
            <ul>
                <li><a href="acasa.html">Acasa</a></li>
                <li><a href="despre.html">Despre</a></li>
                <li><a href="colectii.html">Colectii</a></li>
                <li><a href="produse.html">Produse</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <form class="search-form">
                <input type="text" placeholder="Caută produse">
            </form>
            <a href="cos.html" class="cart">Coș</a>
        </div>
    </header>

    <section class="contact" id="contact">
        <h2>Precomandă / Contact</h2>
        <form class="contact-form">
            <input type="text" placeholder="Nume" required>
            <input type="email" placeholder="Email" required>
            <textarea placeholder="Mesaj" rows="4"></textarea>
            <button type="submit">Trimite</button>
        </form>
        <p class="contact-info">Ne puteți găsi pe Strada Moto nr. 1, București. Telefon: 0720 000 000.</p>
        <img class="map" src="https://via.placeholder.com/600x300" alt="Harta locatie">

        <div class="social">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Brand Moto Termic - Pre-prototip</p>
    </footer>
</body>
</html>
