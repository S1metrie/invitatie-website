<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coș - Brand Haine Termice Moto</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="haine-termice.css">
</head>
<body>
    <header class="site-header">
        <div class="logo">S</div>
        <nav>
            <ul>
                <li><a href="acasa.html">Acasa</a></li>
                <li><a href="despre.html">Despre</a></li>
                <li><a href="colectii.html">Colectii</a></li>
                <li><a href="produse.html">Produse</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="header-right">
            <form class="search-form">
                <input type="text" placeholder="Caută produse">
            </form>
            <a href="cos.html" class="cart">Coș (<span id="cart-count">0</span>)</a>
            <button id="dark-toggle" aria-label="Comută modul">🌓</button>
        </div>
    </header>

    <section class="about">
        <h2>Coșul de cumpărături</h2>
        <div class="progress">
            <div class="step active">Pasul 1: Detalii</div>
            <div class="step">Pasul 2: Plata</div>
        </div>
        <table class="cart-table">
            <thead>
                <tr><th>Produs</th><th>Cantitate</th><th>Preț</th><th>Total</th><th></th></tr>
            </thead>
            <tbody id="cart-rows"></tbody>
        </table>
        <p id="cart-total"></p>
        <button id="clear-cart">Golește coșul</button>
    </section>

    <footer>
        <p>&copy; 2025 Brand Moto Termic - Pre-prototip</p>
    </footer>
    <script src="cart.js"></script>
    <script src="search.js"></script>
    <script src="site.js"></script>
</body>
</html>
